# =====================================================================
# For a full TOML configuration guide, check the Flower docs:
# https://flower.ai/docs/framework/how-to-configure-pyproject-toml.html
# =====================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tinyfl-ids"
version = "1.0.0"
description = ""
license = "Apache-2.0"
# Dependencies for your Flower App
dependencies = [
    "flwr[simulation]>=1.23.0",
    "flwr-datasets[vision]>=0.5.0",
    "torch==2.7.1",
    "torchvision==0.22.1",
    "wandb>=0.17.8",
    "scikit-learn",
    "numpy",
    "pandas",
    "psutil",
    "onnx==1.14.1",
    "emlearn"
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "k"

# Point to your ServerApp and ClientApp objects
[tool.flwr.app.components]
serverapp = "src.server_app:app"
clientapp = "src.client_app:app"

# Custom config values accessible via `context.run_config`
[tool.flwr.app.config]
num-server-rounds = 50
fraction-train = 1 #for how many clients train
local-epochs = 3 #for epochs
lr = 5e-4
mu = 0.1 #change fedprox mu
input-dim = 5 # 67 for IoTID20/CiC-BoTIoT, 5 for T-Pot Dataset

# only for IoTID20/CiC-BoTIoT:
which_dataset = 0 #for which Dataset to train and test
# Default federation to use when running the app

#######################################################################
# CONFIGURATION MIGRATION NOTICE:
#
# What was previously called "federation config" for SuperLink
# connections in pyproject.toml has been renamed and moved.
#
# These settings are now **SuperLink connection configuration**
# and are defined in the Flower configuration file.
#
# The entries below are commented out intentionally and are kept
# only as a migration reference.
#
# Docs: https://flower.ai/docs/framework/ref-flower-configuration.html
#######################################################################

# [tool.flwr.federations]
# default = "local-simulation"

# # Local simulation federation with 4 virtual SuperNodes
# [tool.flwr.federations.local-simulation]
# options.num-supernodes = 4 #for how many client train and test

# # Remote federation example for use with SuperLink
# [tool.flwr.federations.remote-federation]
# address = "0.0.0.0"
# insecure = true  # Remove this line to enable TLS
# #options.num-supernodes = 2

# # root-certificates = "<PATH/TO/ca.crt>"  # For TLS setup

[superlink.embedded-federation]
address = "<insert your IP>" # ControlAPI of your SUPERLINK
insecure = true

[superlink.local-deployment]
address = "<insert your IP>"
insecure = true
